<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var r = l.pathname.split('/').slice(1);
      var i = r.length - pathSegmentsToKeep;
      var repo = r.slice(0, i).join('/');
      var rest = r.slice(i).join('/');
      var p = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' + repo + '/?p=' + rest;
      window.location.replace(p);
    </script>
  </head>
  <body>
    <noscript>
      <h1>404 - Page Not Found</h1>
      <p>Please enable JavaScript to be redirected to the correct page.</p>
    </noscript>
  </body>
</html>
