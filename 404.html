<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting to InfoCrypting</title>
  <script>
    // GitHub Pages 404 redirect for SPA
    var pathSegmentsToKeep = 1;
    var location = window.location;
    
    // Redirect to the correct path with hash routing
    location.replace(
      location.protocol + '//' + location.hostname + 
      (location.port ? ':' + location.port : '') +
      '/InfoCrypting/#' + 
      location.pathname.slice('/InfoCrypting'.length)
    );
  </script>
</head>
<body>
  Redirecting to InfoCrypting...
</body>
</html>
