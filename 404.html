<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>InfoCrypting - Page Not Found</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var r = l.pathname.split('/').slice(1);
      var deploy = r.slice(0, pathSegmentsToKeep);
      var base = '/' + deploy.join('/') + '/';
      var r = l.pathname.slice(1).split('/'), t = r.slice(pathSegmentsToKeep).join('/').slice(1);
      if (l.search[1] === '/' ) {
        var url = l.search.slice(1) + '/' + t;
      } else {
        var url = l.search.slice(1) + '?/' + t;
      }
      window.location.replace(base + url);
    </script>
  </head>
  <body>
    <h1>Redirecting...</h1>
  </body>
</html>
