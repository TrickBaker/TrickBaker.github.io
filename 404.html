<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>InfoCrypting</title>
  <script type="text/javascript">
    // Redirect to the main page with a hash route
    var pathSegmentsToKeep = 1;
    var l = window.location;
    
    // Don't try to handle the path, just redirect to the homepage 
    // and let HashRouter handle the routing
    var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, pathSegmentsToKeep).join('/') + '/#' + 
      l.pathname.slice(1);
      
    window.location.replace(redirectUrl);
  </script>
</head>
<body>
  <h1>Redirecting...</h1>
  <p>If you are not redirected automatically, please <a href="/">click here</a>.</p>
</body>
</html>
