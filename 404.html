      var pathSegmentsToKeep = 0;
      var l = window.location;
      var r = l.pathname.split('/').slice(1);
      var s = r.slice(pathSegmentsToKeep).join('/');
      var m = l.pathname.slice(0, 1).split('/').slice(-1).toString() === '' ? '/' : '';
      var g = (s.slice(-1) === '/' ? s : s + '/');
      var f = g + 'index.html';
      var h = l.origin + m + g;
      var u = l.href;
      var t = h + u.slice(u.indexOf('?') + 1);
      var k = document.querySelector('script[src*="spa-github-pages"]');
      var e = k ? k.getAttribute('src').split('spa-github-pages/')[1].slice(0, -3) : '';
      var o = 'https://cdn.jsdelivr.net/gh/rafgraph/spa-github-pages@' + e + '/spa-github-pages.js';
      var i = document.createElement('script');
      i.async = true;
      i.src = o;
      document.body.appendChild(i);
    </script>
